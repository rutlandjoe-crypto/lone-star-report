name: GSR Lone Star Hourly Update

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: gsr-lone-star-hourly
  cancel-in-progress: false

jobs:
  refresh-lone-star:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Lone Star Report
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Refresh Texas news
        run: npm run fetch:texas

      - name: Validate generated report
        run: |
          node -e "const fs=require('fs'); const p='public/latest_report.json'; if(!fs.existsSync(p)) process.exit(1); const d=JSON.parse(fs.readFileSync(p,'utf8')); console.log('Lone Star report validated'); console.log('Bytes:', fs.statSync(p).size);"

      - name: Commit fresh Lone Star data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/latest_report.json public/source_status.json || true

          if git diff --cached --quiet; then
            echo "No Lone Star data changes to commit."
          else
            git commit -m "Auto refresh Lone Star Report"
            git push
          fi

  refresh-weather:
    name: Refresh Texas weather
    needs: refresh-lone-star
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out latest Lone Star Report
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fetch unexpired NWS forecasts
        run: node scripts/fetch-texas-weather.js

      - name: Publish fresh weather snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/texas_weather.json
          if git diff --cached --quiet; then
            echo "Weather snapshot unchanged."
            exit 0
          fi
          git commit -m "Refresh Texas NWS forecasts"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          echo "Weather publication failed."
          exit 1
